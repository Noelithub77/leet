[package]
name = "practice"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
agent-client-protocol = { version = "3.1", features = ["process"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt", "net", "sync"] }
async-lsp = { version = "0.2.4", default-features = false }
async-io = "2"
async-process = "2"
futures = "0.3"
lsp-types = "0.95"
diesel = { version = "2.3", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = { version = "2.3", features = ["sqlite"] }
dirs = "6"
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
html-escape = "0.2"
htmd = "0.5"
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
nucleo-matcher = "0.3"
strsim = "0.11"
open = "5"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
scraper = "0.27"
toml = "0.9"
ureq = { version = "3", features = ["json"] }
url = "2"
self_update = { version = "1.3.0", default-features = false, features = ["ureq", "rustls", "github", "archive-tar", "compression-tar-gz", "checksums"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = "4.2"

[dev-dependencies]
tempfile = "3"
