[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/gpui-base", "vendor/gpui-component"]

[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
gpui-component = { path = "vendor/gpui-component" }

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "AGPL-3.0-only"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 16
