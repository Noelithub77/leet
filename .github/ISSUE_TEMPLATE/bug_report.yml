name: Bug report
description: Report a reproducible problem in leet.
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, use [private reporting](https://github.com/Noelithub77/leet/security/advisories/new). Redact credentials and personal data."
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "leet --version"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and architecture
      placeholder: "Ubuntu 24.04, x86_64, Wayland"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal example using test data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or redacted logs
