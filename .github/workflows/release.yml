name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', '.cargo/**', 'tests/**', 'ops', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag (vX.Y.Z); leave empty to validate the selected branch'
        required: false
        type: string
      publish:
        description: 'Publish release assets (disable to validate and warm caches only)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  test:
    name: Test Linux workspace
    runs-on: ubuntu-22.04
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Install Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake pkg-config libssl-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libfontconfig1-dev libasound2-dev libvulkan-dev
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Use runner capacity
        run: echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"
      - name: Install Java test compiler
        run: sudo apt-get install -y --no-install-recommends openjdk-17-jdk-headless
      - name: Cache test dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ubuntu-22.04-workspace-tests
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test workspace
        run: cargo test --locked --workspace
      - name: Test installer
        run: python3 tests/install.py

  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Validate version tag
        if: env.RELEASE_TAG != ''
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake pkg-config libssl-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libfontconfig1-dev libasound2-dev libvulkan-dev
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add '${{ matrix.target }}'
      - name: Use the static Windows C runtime
        if: runner.os == 'Windows'
        run: echo 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"
      - name: Use runner capacity
        run: |
          case "$RUNNER_OS" in
            Linux) jobs=$(nproc) ;;
            macOS) jobs=$(sysctl -n hw.logicalcpu) ;;
            Windows) jobs="$NUMBER_OF_PROCESSORS" ;;
          esac
          echo "CARGO_BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
      - name: Cache native release dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.os }}-${{ matrix.target }}-release
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build executable and packaging tool together
        run: cargo build --locked --release --workspace --bins --example release --target '${{ matrix.target }}'
      - name: Check platform code and examples
        run: cargo check --locked --release --workspace --all-targets --target '${{ matrix.target }}'
      - name: Verify Unix executable
        if: runner.os != 'Windows'
        run: target/${{ matrix.target }}/release/leet --version
      - name: Verify Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath 'target/${{ matrix.target }}/release/leet.exe' -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput version.txt -RedirectStandardError version-error.txt
          if ($app.ExitCode -ne 0) { Get-Content version-error.txt; exit 1 }
          $version = Get-Content version.txt -Raw
          if ($version -notmatch '^leet ' -or $version -notmatch [regex]::Escape($env:RELEASE_TAG)) { throw "Unexpected version: $version" }
          Write-Output $version
      - name: Package native release
        if: runner.os != 'Linux' && env.RELEASE_TAG != ''
        run: target/${{ matrix.target }}/release/examples/release${{ runner.os == 'Windows' && '.exe' || '' }} --target '${{ matrix.target }}' --tag "$RELEASE_TAG" --output dist
      - name: Keep the landing page download link compatible
        if: runner.os == 'Windows' && env.RELEASE_TAG != ''
        run: cp "dist/leet-windows-${RELEASE_TAG}.exe" dist/leet-windows-x86_64.exe
      - name: Cache pinned AppImage packaging tools
        if: runner.os == 'Linux' && env.RELEASE_TAG != ''
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/leet-appimage-tools
          key: appimage-tools-${{ matrix.target }}-602438599-610035789-596078161-602438213-610035595-596077442
      - name: Package Linux archive and AppImage from the same executable
        if: runner.os == 'Linux' && env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case '${{ matrix.target }}' in
            x86_64-*)
              deploy_id=602438599; deploy_sha=8aea8da0f7f7039d2a2cecb14657d752a222a5e1d3825caeef186c82f751cdd1
              tool_id=610035789; tool_sha=95cbe7cce9717fce90c484e34052ee7c7f1d7635b33c12525b4776826a7d29b6
              runtime_id=596078161; runtime_sha=156f4bdbde9c52d01814600013e0a273f0118dc2de98975f3c8c63427ec79074 ;;
            aarch64-*)
              deploy_id=602438213; deploy_sha=5c1fddf96066891e829831cac0d84424690f3b22846c7f8f1bb9990a5c6c73f4
              tool_id=610035595; tool_sha=a595ea34cd6136c7f595e9dcbb16f3e9725d7610efb9e43b38c3c6e86cafc270
              runtime_id=596077442; runtime_sha=b4ff0030242d0c3bb12ce40541828303cf167493f4793456f0436edd6255c39d ;;
          esac
          mkdir -p "$RUNNER_TEMP/leet-appimage-tools"
          export LEET_LINUXDEPLOY="$RUNNER_TEMP/leet-appimage-tools/linuxdeploy.AppImage"
          export LEET_APPIMAGETOOL="$RUNNER_TEMP/leet-appimage-tools/appimagetool.AppImage"
          export LEET_APPIMAGE_RUNTIME="$RUNNER_TEMP/leet-appimage-tools/appimage-runtime"
          if [ ! -s "$LEET_LINUXDEPLOY" ]; then
            gh api "repos/linuxdeploy/linuxdeploy/releases/assets/$deploy_id" -H 'Accept: application/octet-stream' > "$LEET_LINUXDEPLOY"
          fi
          if [ ! -s "$LEET_APPIMAGETOOL" ]; then
            gh api "repos/AppImage/appimagetool/releases/assets/$tool_id" -H 'Accept: application/octet-stream' > "$LEET_APPIMAGETOOL"
          fi
          if [ ! -s "$LEET_APPIMAGE_RUNTIME" ]; then
            gh api "repos/AppImage/type2-runtime/releases/assets/$runtime_id" -H 'Accept: application/octet-stream' > "$LEET_APPIMAGE_RUNTIME"
          fi
          printf '%s  %s\n' "$deploy_sha" "$LEET_LINUXDEPLOY" "$tool_sha" "$LEET_APPIMAGETOOL" "$runtime_sha" "$LEET_APPIMAGE_RUNTIME" | sha256sum --check --strict
          chmod +x "$LEET_LINUXDEPLOY" "$LEET_APPIMAGETOOL"
          target/${{ matrix.target }}/release/examples/release --target '${{ matrix.target }}' --tag "$RELEASE_TAG" --output dist
      - uses: actions/upload-artifact@v7.0.2
        if: env.RELEASE_TAG != ''
        with:
          name: ${{ matrix.target }}
          path: dist/leet-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  publish:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.publish)
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums and release notes
        run: |
          cp site/public/install.sh dist/install.sh
          (cd dist && sha256sum leet-* install.sh > SHA256SUMS)
          cat docs/changelog.md > release-notes.md
          printf '\n## Downloads\n\n' >> release-notes.md
          cat >> release-notes.md <<'EOF'
          Native leet builds for Linux (x86_64 and ARM64), macOS (Intel and Apple Silicon), and Windows x64.

          Linux/macOS: `curl -fsSL https://leet.allpyq.in/install.sh | sh`

          Windows: download the versioned `leet-windows-*.exe` and open it. No installer is needed.

          Linux portable: download the versioned `leet-linux-vX.Y.Z.AppImage` or `leet-linux-arm-vX.Y.Z.AppImage`, make it executable, and open it. AppImages include shared application libraries; graphical desktop, compatible glibc, and GPU drivers are still required.

          These builds are unsigned (macOS uses an ad-hoc signature, without notarization). OS security prompts may appear. Linux needs a graphical desktop and Vulkan GPU drivers; x86_64 requires glibc 2.35+, ARM64 requires glibc 2.39+. macOS requires version 13+. Use Setup to install Python or editor tools; compiled solutions still need a compiler. Settings, accounts, and solutions are stored separately from the executable.

          See `docs/releases.md` for requirements, verification, and release operation.
          EOF
      - name: Publish only after all platforms succeed
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "leet $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file release-notes.md
